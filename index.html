<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Maryam Shiran — research interests in machine learning theory, statistics, and optimization.">
  <title>Maryam Shiran</title>

  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      color: #1f2937;
      background: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 640px);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 7vw, 3.5rem);
      font-weight: 600;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 0 14px;
      font-size: 1.05rem;
      color: #4b5563;
    }

    a {
      color: #111827;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    a:hover,
    a:focus-visible {
      color: #6b7280;
    }
  </style>
</head>

<body>
  <main>
    <h1>Hello, I'm Maryam Shiran.</h1>

    <p>
      I am a student interested in machine learning theory, statistics,
      and optimization.
    </p>

    <p>
      I would be happy to hear from you at
      <a href="mailto:maryamshiran561@gmail.com">
        maryamshiran561@gmail.com
      </a>.
    </p>
  </main>
</body>
</html>
