<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Maryam Shiran — research interests in machine learning theory, statistics, and optimization.">
  <title>Maryam Shiran</title>

  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      color: #1f2937;
      background: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #ffffff;
    }

    .hero {
      min-height: 100svh;
      display: grid;
      grid-template-columns: 42% 58%;
    }

    .hero-image {
      min-height: 100svh;
      overflow: hidden;
      background: #0f4c5c;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      min-height: 100svh;
      display: block;
      object-fit: cover;
      object-position: 55% center;
    }

    .hero-content {
      display: flex;
      align-items: center;
      padding: clamp(48px, 7vw, 112px);
    }

    .hero-content-inner {
      width: min(100%, 680px);
    }

    h1 {
      margin: 0 0 22px;
      font-size: clamp(2.8rem, 5vw, 4.8rem);
      line-height: 1.04;
      font-weight: 600;
      letter-spacing: -0.045em;
      color: #111827;
    }

    p {
      margin: 0 0 18px;
      max-width: 620px;
      font-size: clamp(1.05rem, 1.45vw, 1.22rem);
      color: #4b5563;
    }

    a {
      color: #173f4f;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      transition: color 160ms ease;
    }

    a:hover,
    a:focus-visible {
      color: #6b7280;
    }

    @media (max-width: 800px) {
      .hero {
        min-height: 100svh;
        grid-template-columns: 1fr;
        grid-template-rows: 38svh auto;
      }

      .hero-image {
        min-height: 0;
        height: 38svh;
      }

      .hero-image img {
        min-height: 0;
        height: 100%;
        object-position: 50% 48%;
      }

      .hero-content {
        align-items: flex-start;
        padding: 42px 26px 52px;
      }

      h1 {
        font-size: clamp(2.35rem, 11vw, 3.5rem);
        margin-bottom: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="hero">
    <div class="hero-image">
      <img src="maryam-tiles.png" alt="Blue and turquoise Persian tilework">
    </div>

    <section class="hero-content">
      <div class="hero-content-inner">
        <h1>Hello, I'm Maryam Shiran.</h1>

        <p>
          I am a student interested in machine learning theory, statistics,
          and optimization.
        </p>

        <p>
          I would be happy to hear from you at
          <a href="mailto:maryamshiran561@gmail.com">
            maryamshiran561@gmail.com
          </a>.
        </p>
      </div>
    </section>
  </main>
</body>
</html>
